name: Live Resolver

# Runs ONLY the live-resolver stage — resolving which channels are currently
# streaming and writing the result to live_channels. Split out from worker.yml
# because that pipeline is throttled hard by GitHub's scheduler (observed hourly
# gaps of 1h36m-4h05m on 2026-08-04) and live-resolver runs last in it, so
# live-stream state was as stale as the worst cron gap. The website's Live page
# hides any channel resolved more than 180 minutes ago, so every tile went dark
# during long gaps even when the pipeline was perfectly healthy.
#
# `repository_dispatch` lets an external scheduler drive this at a real cadence
# instead of relying on GitHub's own `schedule` trigger, which is the thing that
# is unreliable here. See the bottom of this file for what the owner needs to
# configure to actually do that.
on:
  workflow_dispatch:              # manual trigger from GitHub UI
  repository_dispatch:
    types: [resolve-live]         # external scheduler → POST /repos/:owner/:repo/dispatches

  # Best-effort fallback only. GitHub is dropping roughly eleven of every twelve
  # requested firings on this repo's other scheduled workflows (see premium-scraper.yml
  # and worker.yml), so this cannot be relied on for real cadence — it exists so
  # live state still gets a chance to refresh if the external scheduler below is
  # ever misconfigured or paused, not as the primary trigger.
  schedule:
    - cron: '*/15 * * * *'

# A dispatched run and a scheduled run must not overlap and double-write
# live_channels — same reasoning as worker.yml, just a smaller blast radius.
concurrency:
  group: live-resolver
  cancel-in-progress: false  # queue, never cancel a running job

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Resolve live channels
        run: npm run resolve-live
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

# ── What the owner must configure to drive this at a real cadence ──────────
#
# This workflow does not schedule itself reliably — that is the whole reason it
# exists. An external scheduler must call the GitHub API on the cadence actually
# wanted (e.g. Supabase pg_cron + pg_net calling pg_net.http_post on a `select
# cron.schedule(...)` job). That needs a token with `repo` scope, which is a
# secret only the owner can create and store (e.g. in Supabase Vault) — not
# something this PR can set up.
#
# Endpoint:
#   POST https://api.github.com/repos/mfala22ss/logosia-worker/dispatches
#   Headers:
#     Accept: application/vnd.github+json
#     Authorization: Bearer <token with repo scope>
#     X-GitHub-Api-Version: 2022-11-28
#   Body:
#     {"event_type": "resolve-live"}

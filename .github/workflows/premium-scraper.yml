name: Premium Sources Scraper

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:         # manual trigger from GitHub UI

concurrency:
  group: premium-scraper
  cancel-in-progress: false  # queue, never cancel a running job

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 25 premium feeds take ~8 min wall-clock; the old 5 min cap killed every run.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Scrape premium sources
        run: npm run scrape
        env:
          PREMIUM_ONLY: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}

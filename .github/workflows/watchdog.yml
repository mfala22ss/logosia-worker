name: Watchdog

# Deliberately a SEPARATE workflow from the pipeline it watches. A watchdog that
# runs as a step inside the worker job cannot report that the worker job never
# started — which is exactly what happened when the schedule went quiet for eight
# days in July 2026.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Never queue watchdog runs. If one is somehow slow, the next tick's reading is
# more useful than the stale one finishing — unlike the pipeline, which must not
# overlap itself.
concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # opens, comments on and auto-closes watchdog issues
      actions: write  # dispatches claude.yml for a new actionable issue (see below)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run watchdog
        id: watchdog
        run: npm run watchdog
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL:                  ${{ vars.SITE_URL || 'https://logosia.com.au' }}

          # Alert channels — all optional, configured by presence. Set at least one,
          # or the watchdog can detect an outage and still have nowhere to say so.
          NTFY_TOPIC:                ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL:       ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Read only by the credentials check (models-list probe, no completions).
          # Without these the check reports "no GROQ_KEY set" even though the
          # secrets exist, because the worker jobs get them and this one did not.
          GROQ_KEY:                  ${{ secrets.GROQ_KEY }}
          GROQ_KEY_2:                ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3:                ${{ secrets.GROQ_KEY_3 }}

          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}

      # Summon the repair agent for a NEW actionable issue.
      #
      # The @claude mention in the issue body cannot do this on its own: the issue
      # is created with GITHUB_TOKEN, and GitHub starts no workflow from an event
      # GITHUB_TOKEN created (workflow_dispatch and repository_dispatch are the
      # only exceptions). Until 2026-11-02 that meant watchdog issues #11 to #22
      # never started an agent at all. Dispatching explicitly closes that gap.
      #
      # Runs only when watchdog.js reports a newly opened actionable issue, so an
      # acknowledged condition does not start an agent every 15 minutes.
      # always(): watchdog.js exits 1 for a new condition, which is exactly when
      # this must still run.
      - name: Dispatch repair agent
        if: always() && steps.watchdog.outputs.repair_issue != ''
        run: gh workflow run claude.yml --repo "$GITHUB_REPOSITORY" -f issue="${{ steps.watchdog.outputs.repair_issue }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
